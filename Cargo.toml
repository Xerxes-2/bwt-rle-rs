[package]
name = "bwt-rle-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
compio = { version = "0.18", features = ["macros", "bytes", "fs", "io"] }
futures = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
strip = false
